
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trending Products</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000000;
      color: #fff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: linear-gradient(to right, #111, #222);
    }

    .logo {
      height: 80px;
      width: auto;
    }

    .categories {
      display: flex;
      gap: 20px;
    }

    .category {
      cursor: pointer;
      padding: 10px 15px;
      background-color: #1a1a1a;
      border-radius: 5px;
      color: #ccc;
      transition: 0.3s;
    }

    .category:hover {
      color: #fff;
      background-color: #333;
    }

    .banner {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .main-content {
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- Banner image -->
  <img src="banner.png" alt="Trending Products Banner" class="banner" />

  <!-- Header with logo and categories -->
  <header>
    <img src="logo.jpg" alt="Your Logo" class="logo" />

    <div class="categories">
      <a href="electronices.html"><div class="category">Electronics</div></a>
      <div class="category">Fashion</div>
      <div class="category">Home & Kitchen</div>
      <div class="category">Fitness</div>
      <div class="category">Toys & Gadgets</div>
    </div>
  </header>

  <!-- Main welcome content -->
  <div class="main-content">
    <h2>Welcome to Our Store!</h2>
    <p>Select a category to explore trending products.</p>
  </div>

</body>
</html>
